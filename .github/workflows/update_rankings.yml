name: 高円宮杯 順位自動更新

on:
  # 毎日 7:17 JST (= UTC 22:17) と 22:17 JST (= UTC 13:17) の2回、自動実行
  #  - 7:17 JST … 従来からの朝の更新
  #  - 22:17 JST … [2026-09-05追加] 試合当日の夜に結果を反映するため。
  #    プレミアはJFA公式JSONから取るので、夕方の試合もその日のうちにサイトへ出る。
  #    Keiの希望は「土日祝の夜だけ」だが、GitHub Actionsのcronは日本の祝日を判定できず、
  #    土日限定にすると祝日開催（プレミアでは普通にある）を取りこぼすため毎日回す。
  #    試合が無い日は「変更なし」で終わるだけなので害はない。
  # ⚠️ **毎時00分は避ける（2026-09-08 変更）。** GitHub Actions のスケジュール実行は
  #    00分に世界中のジョブが集中するため遅延しやすく、GitHubのドキュメント自身が
  #    00分を避けることを推奨している。
  #    実例: 2026-09-07 22:00 JST の回が、実際には 2026-09-08 02:59 JST（約5時間遅れ）に走った。
  #    17分にずらしただけで、実行の意味（朝7時台・夜22時台）は変わらない。
  schedule:
    - cron: '17 22 * * *'
    - cron: '17 13 * * *'

  # 手動実行ボタンもGitHub画面から使えるようにする
  workflow_dispatch:
    inputs:
      year:
        description: '対象年度 (例: 2026)'
        required: false
        default: ''
      dry_run:
        description: 'テスト実行 (保存しない)'
        type: boolean
        required: false
        default: false
      # ★2026-09-13 追加：プレミアの結果を最短で出すための範囲指定
      #   9分の実行のうち8分以上は「プレミア以外の取得」だった（run #1200 実測）。
      #   生成・コミット・通知はどの範囲でも必ず走る。取得だけを絞る。
      scope:
        description: '更新する範囲（premier=プレミアだけ・約1分）'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - premier
          - prince
          - pref

  # データ・記事ファイルを編集して push したら即時反映（手動 Run workflow 不要）
  # ※push起動時はスクレイピング(順位取得等)をスキップし、ページ再生成＋コミットだけ走る
  # ※botの自動コミット(GITHUB_TOKEN)はワークフローを再起動しないGitHub仕様のため無限ループしない
  push:
    branches: [main]
    paths:
      - 'data/tournaments_data.yml'
      - 'data/team-profiles/**'
      - 'data/tournaments/**'
      - 'data/university/**'
      - 'data/scorers/**'
      - 'data/u15/**'
      - 'data/league_matches/**'
      # ⚠️ teams.json は県ページ上部の順位表とAI要約一文を作っている。
      #    league_matches と同格なのにここから漏れており、2026-09-07に
      #    teams.json だけを直した push が何も起動せず、反映されない事故が起きた。
      - 'data/teams.json'
      - 'data/national-team-players.yml'
      - 'data/pro-signings.yml'
      - 'data/premier_final_history.yml'
      - 'blog-source/**'

# 同時に2本走らせない設定（2026-07-19追加）
# Push起動・定期実行・手動Runが重なると、後発が「変更があればコミット＆プッシュ」で
# 衝突して赤になるため、同時実行は順番待ちにする（cancel-in-progress: falseで取り消さず待機）
# ⚠️ 順番待ちは「同時に走らないこと」しか保証しない。待っている間に origin が進むと
#    古いSHAで生成して衝突する。そちらは checkout の ref: main で対処している（2026-09-09）。
concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data/teams.json をコミット・プッシュするため

    # ★2026-09-13: 手動Runの範囲指定。schedule / push では inputs が null に
    #   なるので 'all' に落とす（ここが空文字になると env.SCOPE == 'all' の条件が
    #   すべて false になり、見張り2本が二度と走らなくなる）。
    env:
      SCOPE: ${{ github.event.inputs.scope || 'all' }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        # ★ジョブ開始時点の main を取る（2026-09-09）
        #   既定は「イベント発生時点のSHA」なので、concurrency(site-update)で
        #   順番待ちした回が、待っている間に進んだ origin を持たないまま生成し、
        #   同じ生成物ファイル（teams.json/index.html/tournaments.json）で
        #   内容衝突して赤になっていた。順番待ちだけでは防げない。
        with:
          ref: main

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: 依存ライブラリをインストール
        run: |
          pip install -r scraper/requirements.txt
          pip install selenium webdriver-manager pyyaml markdown
          pip install pandas lxml
          pip install pdfplumber

      # ★ プレミア2＋プリンス13の全15リーグはJFA公式が正本（2026-09-05〜／09-06拡大）
      #   ここで成功したリーグは、この後の update.py / update_cross_tables.py が
      #   koko-soccer で上書きしないようスキップする（古い順位に戻る事故を防ぐ）。
      #   取得や検算に失敗したリーグは何も書かずに終わるので、従来どおりkokoが使われる。
      #   リーグごとに独立しているので、1リーグ失敗しても他はそのまま更新される。
      - name: プレミア・プリンスをJFA公式から更新
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE != 'pref' }}
        continue-on-error: true
        run: |
          # ★2026-09-13: scope=premier/prince のときだけ種類を渡す。
          #   リーグのslug一覧はYAMLに書かない（正本は fetch_jfa.py の LEAGUES）。
          ARGS=""
          if [ "$SCOPE" != "all" ]; then ARGS="--group $SCOPE"; fi
          if [ -f scraper/fetch_jfa.py ]; then
            python scraper/fetch_jfa.py $ARGS
          else
            echo "scraper/fetch_jfa.py がまだありません。スキップ。"
          fi

      - name: 順位データを更新
        if: ${{ github.event_name != 'push' }}
        run: |
          YEAR="${{ github.event.inputs.year }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ -n "$YEAR" ]; then ARGS="$ARGS --year $YEAR"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # ★2026-09-13: 取得の範囲だけを絞る。順位の再計算と _meta の更新は
          #   update.py の中で scope に関係なく必ず走る（ページが古いまま残らないように）。
          ARGS="$ARGS --scope $SCOPE"
          python scraper/update.py $ARGS

      - name: 近似重複チームを自動検出・削除
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push' }}
        run: |
          if [ -f scraper/dedup_near_duplicates.py ]; then
            python scraper/dedup_near_duplicates.py
          else
            echo "scraper/dedup_near_duplicates.py がまだありません。スキップ。"
          fi

      # ══════════════════════════════════════════════════════════════
      # ★ ステップの分類（2026-09-07 原則化）
      #   **取得**（外部にアクセスする）… push では飛ばす。push起動はデータを直した人が
      #     すでに正しい値を持っているので、取りに行く必要がない。
      #   **導出**（data/ を読んで data/ を書くだけ）… push でも走らせる。
      #     飛ばすと「データは新しいのに、そこから作る値だけ古い」状態になる。
      #   2026-09-07に、導出4本（この下の同期・順位再計算・クリーンアップ）に
      #   `github.event_name != 'push'` が付いており、data/teams.json や
      #   data/league_matches/** を直接編集して push すると
      #   **ページの上と下が食い違う**事故が起きた。条件を外して解消。
      # ══════════════════════════════════════════════════════════════
      # ★ プレミア・プリンスの成績と順位をリーグJSONから導出（2026-09-07新設）
      #   teams.json が「独立に計算されたもう1つの順位表」になっていた。
      #   fetch_jfa.py は JFAから取れたリーグしか teams.json を書かないので、
      #   kokoへフォールバックしたリーグはリーグJSONだけが新しくなり、
      #   同じページの順位表と戦績表が食い違う（9/7にプリンス九州1部で発生）。
      #   ⚠️ **必ず normalize_league_ranks / cleanup_aliases より前**に置くこと。
      #      cleanup_aliases の renumber_pref_ranks() が leagueRank を並べ替えキーに
      #      使うので、後に置くと県内総合の並びが1回ぶん古いままになる。
      - name: プレミア・プリンスの順位を teams.json へ同期（正本から導出）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ -f scraper/sync_teams_from_leagues.py ]; then
            python scraper/sync_teams_from_leagues.py
          else
            echo "scraper/sync_teams_from_leagues.py がまだありません。スキップ。"
          fi

      - name: リーグ順位を勝点ベースで再計算 (都道府県内のみ)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/normalize_league_ranks.py ]; then
            python scraper/normalize_league_ranks.py
          else
            echo "scraper/normalize_league_ranks.py がまだありません。スキップ。"
          fi

      - name: 大会成績 YAML から JSON を生成
        continue-on-error: true
        run: |
          if [ -f data/tournaments_data.yml ]; then
            python scraper/build_tournaments.py
          else
            echo "data/tournaments_data.yml がまだありません。スキップ。"
          fi

      # ★ エイリアス重複・空チームの自動クリーンアップ
      - name: エイリアス重複・空チームを自動クリーンアップ
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/cleanup_aliases.py ]; then
            python scraper/cleanup_aliases.py --apply --remove-empty
          else
            echo "scraper/cleanup_aliases.py がまだありません。スキップ。"
          fi

      # ★ 戦績表データ(data/league_matches)を更新（順位表と同じ実行で一緒に更新）
      #   ページ生成より前に実行し、最新の戦績表がリーグ／県ページに反映されるようにする
      - name: 戦績表データを更新（プレミア・プリンス）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE != 'pref' }}
        continue-on-error: true
        run: |
          # ★2026-09-13: 絞らないと scope=premier の回でもプリンス13リーグを
          #   kokoから取りに行き、見張りの記録まで書き換わる。
          ARGS=""
          if [ "$SCOPE" != "all" ]; then ARGS="--group $SCOPE"; fi
          if [ -f scraper/update_cross_tables.py ]; then
            python scraper/update_cross_tables.py $ARGS
          else
            echo "scraper/update_cross_tables.py がまだありません。スキップ。"
          fi

      # ★ フォールバック中のリーグに、JFAから「会場」だけを補う（2026-09-08新設）
      #   kokoは会場を持たないので、JFAから落ちたリーグは全試合の会場が空になり、
      #   サイトの表示が「11:00 キックオフ」だけになる（2026-09-08のプリンス九州1部）。
      #   ⚠️ **必ず update_cross_tables.py（koko取得）より後**に置くこと。
      #      前に置くとkoko側の書き込みで会場が消える。
      #   ⚠️ 会場だけを補い、キックオフ時刻には触らない。同じ試合で出典どうしの時刻が
      #      食い違うことがあり（九州1部で2件）、どちらが正しいか判定する材料が無いため。
      - name: フォールバック中のリーグの会場をJFAから補完
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE != 'pref' }}
        continue-on-error: true
        run: |
          if [ -f scraper/backfill_venues.py ]; then
            python scraper/backfill_venues.py
          else
            echo "scraper/backfill_venues.py がまだありません。スキップ。"
          fi

      # ★ 県1部の一部は県協会公式（GoalNote / tecra ほか）から更新（2026-09-06〜）
      #   対象県は増えていく。実数は scraper/fetch_pref_official.py の PREF_OFFICIAL を数えること
      #   （2026-09-07時点で14県。残り32県は junior-soccer・北海道はJSONなし）。
      #   junior-soccer.jp は Actions から403で弾かれるようになり、7/15以降ずっと
      #   自動更新が止まっていた。一部の県は県協会の公式システムにデータがあるので
      #   そちらへ移行した。出典の格が上がるうえ、junior-soccer側にあった
      #   スコア誤り（千葉2件・愛知1件）や重複二重計上（岩手）も解消される。
      #   これらの県は下の junior-soccer のステップでは [skip] される。
      - name: 戦績表データを更新（県1部・県協会公式出典）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && (env.SCOPE == 'all' || env.SCOPE == 'pref') }}
        continue-on-error: true
        run: |
          if [ -f scraper/fetch_pref_official.py ]; then
            python scraper/fetch_pref_official.py
          else
            echo "scraper/fetch_pref_official.py がまだありません。スキップ。"
          fi

      - name: 戦績表データを更新（県1部・junior-soccer出典）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && (env.SCOPE == 'all' || env.SCOPE == 'pref') }}
        continue-on-error: true
        run: |
          if [ -f scraper/update_pref_cross_tables.py ]; then
            python scraper/update_pref_cross_tables.py
          else
            echo "scraper/update_pref_cross_tables.py がまだありません。スキップ。"
          fi

      - name: 県別得点ランキングを更新（県協会公式 / GoalNote）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && (env.SCOPE == 'all' || env.SCOPE == 'pref') }}
        continue-on-error: true
        run: |
          if [ -f scraper/fetch_pref_scorers.py ]; then
            python scraper/fetch_pref_scorers.py
          else
            echo "scraper/fetch_pref_scorers.py がまだありません。スキップ。"
          fi

      # ★ U-15（3種）地域リーグの順位表を自動更新
      #   出典: 関東=連盟公式の結果サイト / 東北=JFA順位表HTML / 他7地域=JFA星取表PDF
      #   検算NG・取得失敗のリーグは既存データを維持する（誤データを載せない安全設計）
      - name: U-15地域リーグ順位表を更新
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE == 'all' }}
        continue-on-error: true
        run: |
          if [ -f scraper/fetch_u15_leagues.py ]; then
            python scraper/fetch_u15_leagues.py
          else
            echo "scraper/fetch_u15_leagues.py がまだありません。スキップ。"
          fi

      # ★ 県予選トーナメント（選手権・インターハイ等）の組み合わせ・結果を自動更新
      #   対象: data/tournaments/*.md のうち frontmatter に source:(kokoのURL) があり status が「終了」でないもの
      #   ログに「⚠ 要確認」が出た試合は週末に手動確認する（誤記検出・出典異常など）
      - name: 県予選トーナメント結果を更新（koko-soccer出典）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE == 'all' }}
        continue-on-error: true
        run: |
          if [ -f scraper/update_tournament_results.py ]; then
            python scraper/update_tournament_results.py
          else
            echo "scraper/update_tournament_results.py がまだありません。スキップ。"
          fi

      # ★ 県ページの上下で数字が食い違わないようにする（2026-09-07新設）
      #   県ページは上部(所属チーム順位表・AI要約)が data/teams.json、
      #   下部(戦績表・直近の試合結果)が data/league_matches/pref-*-1.json を読む。
      #   teams.json は junior-soccer から独立に取っていたため403で7/15以降凍結し、
      #   46県中32県・124チームが上下で食い違っていた。
      #   県1部の順位の出どころを pref-*-1.json に一本化する。
      #   **必ずページ生成より前**に置くこと（生成時点で teams.json が新しい必要がある）。
      - name: 県1部の順位を teams.json へ同期（上下の食い違いを防ぐ）
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ -f scraper/sync_teams_from_pref.py ]; then
            python scraper/sync_teams_from_pref.py
          else
            echo "scraper/sync_teams_from_pref.py がまだありません。スキップ。"
          fi

      # ★ Phase 9-A: 都道府県別 SEO ランディングページ自動生成
      - name: 都道府県別 SEO ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_prefecture_pages.py ]; then
            python scraper/generate_prefecture_pages.py
          else
            echo "scraper/generate_prefecture_pages.py がまだありません。スキップ。"
          fi

      # ★ Phase 9-B: リーグ専用ページと sitemap 完全版を再生成
      - name: リーグ専用ページと sitemap を再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_league_pages.py ]; then
            python scraper/generate_league_pages.py
          else
            echo "scraper/generate_league_pages.py がまだありません。スキップ。"
          fi
          
      # ★ Phase C: チーム個別ページを再生成
      - name: チーム個別ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_team_pages.py ]; then
            python scraper/generate_team_pages.py
          else
            echo "scraper/generate_team_pages.py がまだありません。スキップ。"
          fi

      # ★ Phase C-2: 日本代表（U-16/17/18）選出選手ページを再生成
      - name: 日本代表選出選手ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_national_team_page.py ]; then
            python scraper/generate_national_team_page.py
          else
            echo "scraper/generate_national_team_page.py がまだありません。スキップ。"
          fi

      # ★ Phase C-3: プロ内定・2種登録選手ページを再生成
      - name: プロ内定・2種登録選手ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_pro_signings_page.py ]; then
            python scraper/generate_pro_signings_page.py
          else
            echo "scraper/generate_pro_signings_page.py がまだありません。スキップ。"
          fi

      # ★ Phase 9-D: ブログ記事ページを生成 (Markdown -> HTML)
      - name: ブログ記事ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_blog_pages.py ]; then
            python scraper/generate_blog_pages.py
          else
            echo "scraper/generate_blog_pages.py がまだありません。スキップ。"
          fi

      # ★ インターハイ本選（全国大会）ページを生成
      - name: インターハイ本選ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_interhigh_page.py ]; then
            python scraper/generate_interhigh_page.py
          else
            echo "scraper/generate_interhigh_page.py がまだありません。スキップ。"
          fi
          
      # ★ 総理大臣杯（大学）ページを再生成
      #   data/tournaments/pmc-2026.json にスコアを書いて push すれば、この工程で
      #   トーナメント表(SVG)と対戦表が自動で作り直される（Kei単独で更新できる導線）
      - name: 総理大臣杯ページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_pmc_page.py ]; then
            python scraper/generate_pmc_page.py
          else
            echo "scraper/generate_pmc_page.py がまだありません。スキップ。"
          fi

      # ★ 大学リーグ順位表ページ（/university/）を再生成
      #   data/university/leagues-2026.json を手で直して push した時に反映させる
      - name: 大学サッカーハブページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ -f scraper/generate_university_page.py ]; then
            python scraper/generate_university_page.py
          fi
          if [ -f scraper/generate_university_signings.py ]; then
            python scraper/generate_university_signings.py
          fi

      # ★ Jユースカップ ページを生成
      - name: Jユースカップページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_jyouth_page.py ]; then
            python scraper/generate_jyouth_page.py
          else
            echo "scraper/generate_jyouth_page.py がまだありません。スキップ。"
          fi

      - name: U-15ハブページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_u15_page.py ]; then
            python scraper/generate_u15_page.py
          else
            echo "scraper/generate_u15_page.py がまだありません。スキップ。"
          fi

      - name: 地域大会まとめページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_regional_page.py ]; then
            python scraper/generate_regional_page.py
          else
            echo "scraper/generate_regional_page.py がまだありません。スキップ。"
          fi

      - name: U-18年間スケジュールページを再生成
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f scraper/generate_u18_calendar.py ]; then
            python scraper/generate_u18_calendar.py
          else
            echo "scraper/generate_u18_calendar.py がまだありません。スキップ。"
          fi

      - name: 変更があればコミット＆プッシュ
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ★修正: 生成物の取り残し（未ステージ）でpushが失敗するのを防ぐため全変更をステージ
          git add -A

          # データファイル
          if [ -f data/teams.json ]; then git add data/teams.json; fi
          if [ -f data/tournaments.json ]; then git add data/tournaments.json; fi

          # SEO ランディングページと sitemap
          if [ -d prefectures ]; then git add prefectures; fi
          if [ -d leagues ]; then git add leagues; fi
          if [ -d teams ]; then git add teams; fi
          if [ -d blog ]; then git add blog; fi
          if [ -d blog-source ]; then git add blog-source; fi
          if [ -d tournaments ]; then git add tournaments; fi
          if [ -d data/tournaments ]; then git add data/tournaments; fi
          if [ -d u15 ]; then git add u15; fi
          if [ -d data/u15 ]; then git add data/u15; fi
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if [ -f index.html ]; then git add index.html; fi

          # 変更がある場合のみコミット & push
          if git diff --staged --quiet; then
            echo "変更なし – push スキップ"
          else
            git commit -m "chore: 順位/大会データ・SEO/リーグページ自動更新 $(date '+%Y-%m-%d')"
            # ★修正(2026-07-11): push が3回とも失敗したらジョブを赤(失敗)にする
            #   以前は失敗しても緑のまま終わり「Actionsは緑なのにサイトが変わらない」罠の原因だった
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                PUSHED=1
                break
              fi
              # ★rebaseが衝突したまま次へ進むと、後続ステップが detached HEAD で全部こける
              #   （2026-09-09 実測: 見張りの記録を保存 が commit exit=128 で失敗）
              git rebase --abort 2>/dev/null || true
              echo "push 失敗、リトライ $i/3 ..."
              sleep 5
            done
            if [ "$PUSHED" != "1" ]; then
              echo "--- 失敗時の状態 ---"; git status --short | head -20
              echo "::error::push が3回失敗しました。サイトに反映されていません。このステップのログを確認してください。"
              exit 1
            fi
          fi

      # ★ Phase 9-E: IndexNow に更新を通知（Bing 等への即時インデックス通知）
      #   [2026-09-08] **見張り2本より前に移した。** 以前は一番最後に置いていたため、
      #   `取得元を点検` が赤で終わった日は後続としてスキップされ、
      #   **データはpushできているのに検索エンジンへの通知だけが飛ばない**状態になっていた
      #   （2026-09-08朝に実際に発生）。IndexNowは取得ではなく通知なので、
      #   点検の前で何も困らない。
      - name: IndexNow に更新を通知
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          if [ -f scraper/notify_indexnow.py ] && [ -f sitemap.xml ]; then
            python scraper/notify_indexnow.py
          else
            echo "scraper/notify_indexnow.py または sitemap.xml がありません。スキップ。"
          fi

      # ★ 取得元の見張り（2026-09-06新設）
      #   どのリーグがどの出典から入ったかは data/fetch_status.json に記録済み。
      #   ここでそれを読み、JFA以外に落ちたリーグを [要注意] として出す。
      #   **わざと一番最後に置いている**：ページ生成とコミットを先に終わらせてから
      #   赤くするため。ここを前に置くと、赤くなった日はサイトが更新されなくなる。
      #   赤になる条件: 3回連続でJFA以外 / 会場を持つ試合数が前回の半分未満 / 記録なし
      # ★ 県1部の見張り（2026-09-07新設）
      #   2026-07-15に県1部の自動更新が全県で死んだのに7週間気づけなかった。
      #   ワークフローは緑のままだったから。「止まったこと」を知らせる仕組みが要る。
      #   ⚠️ **必ずページ生成・コミットより後**に置くこと。赤にしてもサイトの更新は
      #      止めない（古いデータでもサイトは動き続け、GitHubのトップに×が出るだけ）。
      #   ⚠️ continue-on-error は付けない（付けると赤にならず、作った意味が無くなる）。
      - name: 県1部の鮮度を点検（止まっていたら赤にする）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE == 'all' }}
        run: |
          if [ -f scraper/audit_pref_freshness.py ]; then
            python scraper/audit_pref_freshness.py
          else
            echo "scraper/audit_pref_freshness.py がまだありません。スキップ。"
          fi

      - name: 取得元を点検（JFA以外に落ちたリーグを検出）
        if: ${{ github.event.inputs.dry_run != 'true' && github.event_name != 'push'
                && env.SCOPE == 'all' }}
        run: |
          if [ -f scraper/check_fetch_status.py ]; then
            python scraper/check_fetch_status.py
          else
            echo "scraper/check_fetch_status.py がまだありません。スキップ。"
          fi

      # ══════════════════════════════════════════════════════════════
      # ★ 見張りの記録を保存する（2026-09-07新設）
      #   ⚠️ **コミットより後ろに置いたステップの書き込みは、ログには出るが捨てられる。**
      #      「走っている・ログも出る・ジョブも緑」なのに記録だけが残らない、という形になる。
      #      実際 audit_pref_freshness と check_fetch_status の2本がこれで、
      #      - audit の last_change（消化数が最後に増えた日）が1日も貯まらず、
      #        黄の判定「消化数が14日増えていない」が前回値と比較できていなかった
      #      - check の consecutiveFallback が毎回0に戻り、**「3回連続フォールバックで赤」
      #        という見張りが 2026-09-06 の新設以来ずっと機能していなかった**
      #   見張り自体はサイト更新を止めないために**コミットより後**に置く必要があるので、
      #   記録の保存だけをここで行う。
      #   ⚠️ **if: always() が必須。** 監査が赤(exit 1)で終わるとその後のステップは
      #      通常スキップされ、**赤くなった日にこそ記録が残らない**という最悪の形になる。
      #   ※ data/fetch_status.json は push トリガーの paths に入っていないので、
      #     このコミットでワークフローが再起動することはない
      #     （加えて GITHUB_TOKEN による push は仕様上ワークフローを起動しない）。
      # ══════════════════════════════════════════════════════════════
      - name: 見張りの記録を保存（赤でも必ず残す）
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          # ★前のステップが rebase 途中で終わっている可能性があるので先に畳む
          #   （畳まないと detached HEAD のまま add/commit がこける。2026-09-09 実測）
          git rebase --abort 2>/dev/null || true
          if [ -z "$(git status --porcelain data/fetch_status.json)" ]; then
            echo "data/fetch_status.json に変更なし。コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fetch_status.json
          git commit -m "chore: 見張りの記録を更新 (fetch_status.json)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "保存しました。"; exit 0
            fi
            # ★rebaseが衝突したまま次へ進むと、後続ステップが detached HEAD で全部こける
            #   （2026-09-09 実測: 見張りの記録を保存 が commit exit=128 で失敗）
            git rebase --abort 2>/dev/null || true
            echo "リトライ $i"; sleep 5
          done
          echo "::error::fetch_status.json の保存に失敗しました"
          exit 1
