# data/league_history_full.yml
# ============================================================
# リーグの「全史」データ（歴代順位表・名称の変遷・プレミア昇格の歴史）
# generate_league_pages.py の render_league_chronicle_html() が読む。
#
# ■ 構造
#   トップレベルのキー = リーグ系統のID（1部・2部で分かれていても1つにまとめる）
#     slugs:  このデータを表示するリーグページのslug（複数可）
#     eras:   時代ごとの順位表。1つのeraが1つの表になる。
#     seasons[].rows[].teams[] の各要素:
#       name  : 表示名（その年度の表記をそのまま使う）
#       mark  : 昇降格などのマーカー（era.legend のキーと対応。無ければ省略）
#       sub   : 補足の数字や語（2004-2007の「（3）」＝決定戦後の最終順位など）
#
# ■ マーカーのキー（era.legend で意味を定義する）
#   premier / playoff / up / down / pref_down / zenkoku / final / stay / stay_po
#
# ■ 出典
#   2003-2024: Wikipedia『高円宮杯 JFA U-18サッカープリンスリーグ北信越』の歴代成績表
#              （セルの色分けもDOMから機械的に読み取って転記。目視転記はしていない）
#   2025:      JFA公式および北信越サッカー協会公式の最終順位表PDF（2本が独立に一致・勝点/得失点差も再計算で検算済み）
#
# ■ 更新のしかた
#   毎年12月にシーズンが終わったら、最新年度を eras[0].seasons の先頭に追加する。
#   マーカーは「その年度に何が起きたか」であって翌年の所属ではない。混同しない。
# ============================================================

hokushinetsu:
  label: プリンスリーグ北信越
  slugs:
    - prince-hokushinetsu-1
    - prince-hokushinetsu-2
  first_year: 2003
  current_kai: 24
  intro: >-
    プリンスリーグ北信越は2003年に第1回が開催され、2026年で第24回を迎えた。
    新潟・富山・石川・福井・長野の5県のチームが参加する。
    ここでは第1回から前年度までの全順位と、リーグの形と名称がどう移り変わってきたかをまとめる。
  # ページごとの導入文（1部ページと2部ページで書き分ける）
  intro_by_slug:
    prince-hokushinetsu-1: >-
      1部は北信越の最上位カテゴリで、ここを制すればプレミアリーグ参入戦への道が開ける。
      ただし実際にプレミアへ昇格できたのは、23シーズンを通じて4回（富山第一が2回、アルビレックス新潟U-18と帝京長岡が1回ずつ）だけである。
    prince-hokushinetsu-2: >-
      2部は2023年に新設されたばかりのカテゴリで、上位が1部へ昇格し、下位が都道府県リーグへ落ちる。
      2部の歴史はまだ浅いが、その下のリーグから上がってくるチームにとっては全国リーグへの入口にあたる。

  # ---- 大会名称の変遷 ----
  name_history:
    - period: 2003年〜2010年
      name: JFAプリンスリーグU-18 北信越
    - period: 2011年〜2017年
      name: 高円宮杯U-18サッカーリーグ プリンスリーグ北信越
    - period: 2018年〜
      name: 高円宮杯 JFA U-18サッカープリンスリーグ 北信越

  # ---- 大会方式の変遷 ----
  format_history:
    - period: 2003年
      text: 6チームによる1回戦総当たり。優勝チームが高円宮杯全日本ユース(U-18)選手権の出場権を得た。
    - period: 2004年
      text: A・Bブロック各6チームの1回戦総当たりを行い、各ブロック1〜2位による優勝決定戦を実施。
    - period: 2005年〜2006年
      text: A・Bブロック各8チームの1回戦総当たり。各ブロック1〜2位が優勝決定戦、3〜4位が残留戦に回った。
    - period: 2007年
      text: A・Bブロック各8チームの1回戦総当たり。残留戦に回るのが各ブロック4〜5位に変わった。
    - period: 2008年
      text: ブロック分けを廃し、12チームの1回戦総当たりに。8〜12位が入れ替え戦に回った。
    - period: 2009年
      text: 12チームの1回戦総当たり。1〜6位が翌年の1部、7〜11位が2部へ回り、12位が県1部へ降格した。
    - period: 2010年
      text: 1部6チームの2回戦総当たりと、2部10チームの1回戦総当たり。2部1〜3位が1部へ昇格した。
    - period: 2011年
      text: 1部・2部とも8チームの2回戦総当たり。2部1〜2位が1部へ昇格、2部8位が県1部へ降格した。
    - period: 2012年
      text: 1部・2部とも8チームの2回戦総当たり。2部5〜8位が県1部へ降格した。翌2013年から1部制に戻る。
    - period: 2013年
      text: 10チームの2回戦総当たり。10位が県1部へ降格し、7〜9位が参入戦に回った。
    - period: 2014年〜2022年
      text: 10チームの2回戦総当たり。9〜10位が県1部へ降格する形が定着した。
    - period: 2020年
      text: 新型コロナウイルスの影響で日程・方式を変更。東西5チームずつの1回戦総当たりの後、順位決定戦を行った。
    - period: 2021年
      text: 新型コロナウイルスの影響で日程の一部が消化できず、チームごとに試合数の差が生じたため、1試合平均勝点で順位を決定した。
    - period: 2023年〜
      text: 1部10チーム・2部8チームの2部制に移行。2部の上位が1部へ昇格し、下位が県リーグへ降格する。

  # ---- プレミアリーグ（全国リーグ）への昇格 ----
  premier_promotions:
    - year: 2010
      team: 富山第一高校
      link: toyama-daiichi
      note: 2011年のプレミアリーグ発足に伴う参入。北信越から初のプレミア勢となった。
    - year: 2015
      team: アルビレックス新潟U-18
      link: albirex-niigata-u18
      note: 参入戦を勝ち抜き2016年からプレミアEASTへ。
    - year: 2017
      team: 富山第一高校
      link: toyama-daiichi
      note: 2018年からプレミアEASTへ復帰。
    - year: 2023
      team: 帝京長岡高校
      link: teikyo-nagaoka
      note: 2024年からプレミアEASTへ。2部制移行の初年度に1部を制した。
  premier_note: >-
    プレミアリーグへ上がったのはこの4回のみで、いずれも1年で戻ってきているわけではない点も含め、
    北信越からの全国リーグ到達は簡単ではない。参入戦の出場権だけを得て昇格に届かなかった年は
    下の順位表で「参入戦」のマーカーが付いたチームにあたる。

