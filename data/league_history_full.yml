tohoku:
  label: プリンスリーグ東北
  slugs:
    - prince-tohoku
  first_year: 2003
  current_kai: 24
  intro: >-
    プリンスリーグ東北は2003年に第1回が開催され、2026年で第24回を迎えた。
    青森・岩手・宮城・秋田・山形・福島の6県のチームが参加する1部制のリーグで、
    上位がプレミアリーグプレーオフに進み、下位が県リーグへ降格する。
    ここでは第1回から前年度までの全順位と、リーグの形と名称がどう移り変わってきたかをまとめる。

