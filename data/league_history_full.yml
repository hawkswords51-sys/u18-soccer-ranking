                - { name: 札幌創成 }
                - { name: 北海 }
                - { name: 大谷室蘭 }
                - { name: 旭川実, link: asahikawa-jitsugyo }
                - { name: 駒大苫小牧, mark: down }
                - { name: 北照, mark: down }
            - div: FAリーグ
              teams:
