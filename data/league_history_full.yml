kanto:
  label: プリンスリーグ関東
  slugs:
    - prince-kanto-1
    - prince-kanto-2
  first_year: 2003
  current_kai: 24
  intro: >-
    プリンスリーグ関東は2003年に第1回が開催され、2026年で第24回を迎えた。
    茨城・栃木・群馬・埼玉・千葉・東京・神奈川・山梨の1都7県のチームが参加する。
    ここでは第1回（2003年）から前年度（2025年・第23回）までの全順位と、リーグの形と名称がどう移り変わってきたかをまとめる。
  intro_by_slug:
    prince-kanto-1: >-
      1部は関東の最上位カテゴリで、上位チームにプレミアリーグ参入戦への出場権が与えられる。
      23シーズンの優勝は14チームが分け合っており、最多はFC東京U-18の4回（2008・2009・2010・2019年）である。
      直近の2025年は上位3チームが参入戦に回ったが、いずれも敗退してプレミア昇格はゼロだった。
    prince-kanto-2: >-
      2部が置かれているのは2008年〜2013年と2022年以降で、上位が1部へ昇格し、下位が都県リーグへ降格する。
      2014年〜2021年は2部が無く1部だけの1部制だったため、その期間の表には2部の順位が載っていない。
      2011年の2部はグループA・グループBの2つに分かれて行われた。

  # ---- 大会名称の変遷 ----
