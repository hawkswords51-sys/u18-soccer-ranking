# プリンスリーグ九州（2026-08-26追加）
# ★出典はWikipediaではなく宮崎県サッカー協会U-18の記録ページ（Keiが発見）。
#   https://miyazaki-fa-u18.net/record/kiroku/prince.htm から年度別ページへ。
#   Wikipediaの九州の記事は優勝校しか載っていないが、こちらは全順位＋勝点/得失点まである。
# ★昇降格は色ではなく表の下の説明文に明記されている。説明文が無い年はマーカーを付けていない。
# ============================================================

kyushu:
  label: プリンスリーグ九州
  slugs:
    - prince-kyushu-1
    - prince-kyushu-2
  first_year: 2003
  current_kai: 24
  intro: >-
    プリンスリーグ九州は2003年に第1回が開催され、2026年で第24回を迎えた。
    福岡・佐賀・長崎・熊本・大分・宮崎・鹿児島・沖縄の8県のチームが参加する。
    ここでは第1回から前年度までの全順位と、リーグの形と名称がどう移り変わってきたかをまとめる。
  intro_by_slug:
    prince-kyushu-1: >-
      1部は九州の最上位カテゴリで、ここを制すればプレミアリーグ参入戦への道が開ける。
      第1回から2025年までの23シーズンで優勝したのは14チーム。最多は大津の4回（2011・2012・2015・2020年）で、
      鹿児島城西とサガン鳥栖U-18が3回で続く。
      この23シーズンにプレミアリーグへ上がったのはのべ11回・7チームで、
      アビスパ福岡U-18と大津がそれぞれ3回を占める。
    prince-kyushu-2: >-
      2部が置かれたのは2004年から2014年までと、2023年に再開されてから現在までの計14シーズンである。
      間の2015年から2022年までの8シーズンは1部だけの1部制で、2部は行われていなかった。
      上位が1部へ昇格し、下位が県リーグへ落ちるという入口と出口の役割は、どちらの時代も変わっていない。

