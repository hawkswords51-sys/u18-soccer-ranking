premier_east:
  label: プレミアリーグEAST
  slugs:
    - premier-east
  show_kai: false          # プレミアは公式に「第◯回」を使わないため回次の列を出さない
  related:
    - { label: プレミアリーグ ファイナル 歴代結果, url: /leagues/premier-final/ }
  first_year: 2011
  current_kai: 16
  intro: >-
    プレミアリーグEASTは、2011年に始まった全国リーグ「高円宮杯 JFA U-18サッカープレミアリーグ」の東日本グループである。
    各地域のプリンスリーグの上位から勝ち上がったチームだけが参加でき、年末にはEASTとWESTの優勝チームがファイナルで日本一を争う。
  intro_by_slug:
    premier-east: >-
      実際に開催された14シーズンでEASTを制したのは9チーム。最多は青森山田高校の4回（2016・2019・2021・2023年）で、鹿島アントラーズユースの3回（2015・2018・2025年）が続く。なお東西の分け方は地理や移動距離を考えて毎年決められるため、同じチームでも年によって所属が変わることがある（京都サンガF.C. U-18は2017年だけ、富山第一高校は2018年だけEASTに所属した）。

  # ---- 大会名称の変遷 ----
  name_history:
    - period: 2011年〜2017年
      name: 高円宮杯U-18サッカーリーグ プレミアリーグ EAST
