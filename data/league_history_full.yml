premier_west:
  label: プレミアリーグWEST
  slugs:
    - premier-west
  show_kai: false          # プレミアは公式に「第◯回」を使わないため回次の列を出さない
  related:
    - { label: プレミアリーグ ファイナル 歴代結果, url: /leagues/premier-final/ }
  first_year: 2011
  current_kai: 16
  intro: >-
    プレミアリーグWESTは、2011年に始まった全国リーグ「高円宮杯 JFA U-18サッカープレミアリーグ」の西日本グループである。
    チーム数はEASTと同じで、2011年から2021年までが10チーム、2022年からは12チーム。
    2020年は全国で中止となり、地域別の代替大会に置き換えられた。
  intro_by_slug:
    premier-west: >-
      実際に開催された14シーズンでWESTを制したのは7チームしかない。サンフレッチェ広島ユースが6回（2011・2012・2016・2018・2021・2023年）、ヴィッセル神戸U-18が3回（2013・2017・2025年）で、この2チームだけで9回を占める。広島ユースは2011年の開幕から一度も降格しておらず、2026年まで16年続けて在籍している。
      実際に開催された14シーズンでWESTを制したのは7チームしかない。サンフレッチェ広島ユースが6回（2011・2012・2016・2018・2021・2023年）、ヴィッセル神戸U-18が3回（2013・2017・2025年）で、この2チームだけで9回を占める。広島ユースは2011年の開幕から一度も降格しておらず、2026年まで16年続けて在籍している。

