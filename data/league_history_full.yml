hokkaido:
  label: プリンスリーグ北海道
  slugs:
    - prince-hokkaido
  first_year: 2003
  current_kai: 24
  intro: >-
    プリンスリーグ北海道は2003年に第1回が開催され、2026年で第24回を迎えた。
    全国に9つあるプリンスリーグの中で、ただ一つ1つの都道府県（北海道）のチームだけで構成されるリーグである。
    第1回から2025年までの23シーズンで優勝したのは7チームだけで、北海道コンサドーレ札幌U-18が12回、旭川実業が5回を占める。
    ここでは第1回から前年度までの全順位と、リーグの形と名称がどう移り変わってきたかをまとめる。

  # ---- 大会名称の変遷 ----
  name_history:
    - period: 2003年〜2010年
      name: JFAプリンスリーグU-18 北海道
    - period: 2011年〜2017年
      name: 高円宮杯U-18サッカーリーグ プリンスリーグ北海道
    - period: 2018年〜
      name: 高円宮杯 JFA U-18サッカープリンスリーグ 北海道

  # ---- 歴代順位 ----
  fold_from_era: 1
  eras:
    - title: 2024年〜（プリンスリーグ＋北海道FAリーグ）
      note: >-
        2024年に下部リーグとして「北海道FAリーグ」が新設された。
        北海道サッカー協会の資料では「プリンス2部」と呼ばれることもあるが、
        JFAが定めるプリンスリーグの枠組みには含まれていない。
        プリンスの下位2チームとFAリーグの上位2チームが入れ替わり、FAリーグの下位2チームはブロックリーグへ降格する。
      cols: [優勝, 2位, 3位, 4位, 5位, 6位, 7位, 8位]
      legend:
        playoff: プレミアリーグプレーオフ出場（昇格ならず）
        down: 北海道FAリーグへ降格
        up: プリンスリーグ北海道へ昇格
        pref_down: ブロックリーグへ降格
      seasons:
        - kai: 23
          year: 2025
          note: >-
            FAリーグ2位の札幌大谷高2ndは、トップチームがプリンスに残留したため昇格できず、
            3位の北照高が繰り上げ昇格となった。
          rows:
            - div: プリンス
              teams:
                - { name: 札幌大谷, link: sapporo-otani, mark: playoff }
                - { name: コンサドーレ, link: consadole-sapporo-u18 }
                - { name: 北海 }
                - { name: 旭川実, link: asahikawa-jitsugyo }
                - { name: 大谷室蘭 }
                - { name: 札幌光星, link: sapporo-kosei }
                - { name: 札幌創成, mark: down }
                - { name: 札幌第一, mark: down }
            - div: FAリーグ
              teams:
                - { name: 帯広北, mark: up }
                - { name: 札幌大谷高2nd, sub: 昇格不可 }
                - { name: 北照, sub: 繰り上げ, mark: up }
                - { name: 旭川実2nd }
                - { name: 大谷室蘭2nd }
                - { name: VITA FC }
                - { name: 駒大苫小牧, mark: pref_down }
                - { name: 旭川志峯, mark: pref_down }
        - kai: 22
          year: 2024
          rows:
            - div: プリンス
              teams:
                - { name: コンサドーレ, link: consadole-sapporo-u18, mark: playoff }
