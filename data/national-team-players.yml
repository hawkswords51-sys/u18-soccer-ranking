# 出典: JFA公式「招集メンバー」ページ（各カテゴリの最新招集）
# 更新方法: 新しい招集が発表されるたびに、該当カテゴリの
#           event / period / source / players を差し替える（手順書5-x参照）
# 注意:
#   - name は JFA原文の表記（姓と名の間は半角スペース1つ）。
#   - club は JFA原文の所属表記。トップ↔ユースの名寄せは生成スクリプト側で行う。
#   - no（背番号）のキーは必ず "no" とダブルクォートで囲む。
#       YAMLでは裸の no が真偽値 false と解釈され、背番号が表示されなくなる
#       （2026-07-08〜2026-09-09の間、実際に全カテゴリで空欄になっていた）。
#       背番号が未発表の招集では no ごと省略してよい（列が自動で消える）。
#   - grade（学年）はJFA非公表。分かる場合のみ記入、無ければ空でよい。
#   - origin（任意）: 現所属がトップ/大学/プロ等で、出身のU-18年代チームが別の場合に記入。
#       表示は「現所属 ← 出身チーム」となり、リンク・バッジは出身チーム側に付く。
#       例）増田大空: club=ジュビロ磐田 / origin=流通経済大学付属柏高校（流経大柏にリンク）
#       ※そのクラブの下部組織上がり（2種登録）はorigin不要。生成側が自動でU-18名にしてリンクする。
# =====================================================================
