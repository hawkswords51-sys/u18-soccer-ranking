# =====================================================================
# 日本代表（SAMURAI BLUE・U-21・U-19・U-18・U-17・U-16）選出選手データ
# ---------------------------------------------------------------------
# 出典: JFA公式「招集メンバー」ページ（各カテゴリの最新招集）
# 更新方法: 新しい招集が発表されるたびに、該当カテゴリの
#           event / period / source / players を差し替える（手順書5-x参照）
# 注意:
#   - name は JFA原文の表記（姓と名の間は半角スペース1つ）。
#   - club は JFA原文の所属表記。トップ↔ユースの名寄せは生成スクリプト側で行う。
#   - no（背番号）のキーは必ず "no" とダブルクォートで囲む。
#       YAMLでは裸の no が真偽値 false と解釈され、背番号が表示されなくなる
#       （2026-07-08〜2026-09-09の間、実際に全カテゴリで空欄になっていた）。
#       背番号が未発表の招集では no ごと省略してよい（列が自動で消える）。
#   - grade（学年）はJFA非公表。分かる場合のみ記入、無ければ空でよい。
#   - origin（任意）: 現所属がトップ/大学/プロ等で、出身のU-18年代チームが別の場合に記入。
#       表示は「現所属 ← 出身チーム」となり、リンク・バッジは出身チーム側に付く。
#       例）増田大空: club=ジュビロ磐田 / origin=流通経済大学付属柏高校（流経大柏にリンク）
#       ※そのクラブの下部組織上がり（2種登録）はorigin不要。生成側が自動でU-18名にしてリンクする。
#       ※2026-09-25 以降は u18 を使う（origin は互換のため読むだけ）。
#   - table（カテゴリの任意キー・2026-09-25追加）: career を書くと「経歴型」の表（所属／大学／U-18／U-15）。
#       書かないカテゴリは「ユース型」（所属チーム／U-15）。人数などで自動判定はしない。
#   - univ（任意・2026-09-25追加）: 在籍したことのある大学（短い形）。卒業・在学中・在籍のまま移籍を区別しない。大学を経ていない選手は書かない。
#   - u18 / u15（任意・2026-09-25追加）: その選手が U-18 年代・U-15 年代に所属したチーム（出身チーム）。
#       u18 があれば、リンク・チームページのバッジは u18 側に付き、「このチーム出身の日本代表選手」になる
#       （origin より優先。origin 付きの既存選手は従来どおり在籍中のバッジ）。
#       u15 は表示だけ（U-15 のチームページはまだ無いのでリンクしない。U-18 ページへ寄せてはいけない＝別チーム）。
#       いま U-18 チームに在籍中の選手は u18 を書かない（所属＝U-18 チーム）。
#       出典の優先順位：J.LEAGUE 選手名鑑の経歴 → クラブ・大学公式 → JFA 選手ページ → 報道 → Wikipedia（最後の手段）。
#       確認できないものは書かない（空欄）。u15 が2チームのときは「→」でつなぐ。
# =====================================================================
