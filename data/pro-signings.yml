# =====================================================================
# プロ内定・プロ契約済み選手データ（U-18年代 → Jリーグ）
# ---------------------------------------------------------------------
# 出典ハブ: 高校サッカードットコム「【2027年】高校年代サッカー・Jリーグ・海外内定者一覧」
#            https://koko-soccer.com/news/42-jleague2015/53555-2023jleaguenaitei
#          ただし★ハブ一覧は「まだ加入していない内定者」と「すでにプロ契約済みの選手」を
#          同じ表に並べている。2026-08-07に全42名を1人ずつクラブ公式で照合し、
#          status で仕分けした（手順書3-1準拠）。
#
# 更新方法: 新しい発表が出るたびに、該当リストに1行足す（手順書4-13参照）。
#
# 【最重要】status を必ず付けること:
#   status: naitei … まだ高校/ユースに在籍。これから加入する「内定者」
#   status: pro    … すでにプロ契約を締結し、トップチームに登録済み（背番号あり）
#   ★Jクラブ育成組織では「高校在学中にプロ契約＋2種登録でユースにも所属」が標準化しており、
#     クラブのリリースは「加入内定」ではなく「プロ契約締結のお知らせ」で出る。
#     ハブ一覧をそのまま取り込むと、すでにプロの選手を「内定者」として誤掲載する。
#     （実例: 北原槙=2025年7月にFC東京とプロ契約済みなのに2027年内定者として載っていた→2026-08-07に削除）
#
# 注意:
#   - team は「現所属チーム（＝当サイトの表記）」。ここがチーム詳細ページへのリンク元になる。
#     サイトのチーム名に寄せて書く（例: 東海大翔洋高校／鹿島アントラーズユース）。
#     表記ゆれの名寄せは scraper/national_team.py の CLUB_ALIASES を共用。
#   - name は姓と名の間に半角スペース1つ（JFA/クラブ公式表記に準拠）。
#   - dest は加入先のトップクラブ名。テキスト表示のみ（リンクなし）。
#   - cat は "高体連"（高校）か "Jユース"（Jクラブ育成組織）。
#   - timing は加入時期。クラブごとに公式の言い回しが違うので、公式表記に寄せて短く書く。
#     秋春制移行で「2026/27シーズン」「2027年1月」「2027年2月」が混在する（統一しない）。
#   - num は背番号（status: pro のみ）。★キー名を "no" にしてはいけない：
#     YAMLは裸の no を真偽値 false として解釈するため、キーが False になって値が読めなくなる。
#   - type2: true ＝「2種登録選手」。クラブ公式で確認できたものだけ付ける（憶測禁止）。
#     ★2種登録はシーズン前後にクラブが一括発表する運用のため、当データは網羅していない。
#       ページ側に「一部のみ掲載」と注記すること。
# =====================================================================
