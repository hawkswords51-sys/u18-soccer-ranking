#   特設ページの「両校のデータを比べる」とSNS用の対戦カード画像が読む（senshuken_matchup.py）。
#   ここに無い学校・組み合わせは、その行を出さない（推測で埋めない）。
#
# ■ best：選手権の最高成績（全期間）
