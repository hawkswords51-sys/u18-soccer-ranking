#                    ＋第104回（2025年度）は JFA公式の試合データ
#   - 2014〜2025年度のベスト4・ベスト8など … JFA公式の試合データ
#                    https://www.jfa.jp/match/alljapan_highschool_{年度}/match/schedule.json
#   - 2013年度以前のベスト4以下 … 各校のチームページ（data/team-profiles/）の記載（src: team-page）
#   書き方：「優勝◯回（最後は◯年度）」「準優勝（◯年度）」「ベスト4（◯年度）」…「初出場」
#   ★2026-11-17 の照合で、飯塚のチームページ「ベスト8（2022年度）」は誤りと判明（JFA公式・ゲキサカとも
#     3回戦で日体大柏に0-1＝ベスト16）。ここはベスト16にしてある。チームページの訂正は別途。
#
# ■ head_to_head：全国大会（選手権・インターハイ）2016〜2025年度の直接対決
#   - 出典：JFA公式の試合データ（選手権 alljapan_highschool_{年度}／インハイ koukou_soutai_{年度}/men）
#     2020年度のインハイは中止。2026年度のインハイは data/tournaments/interhigh-final-2026.md で確認（該当なし）。
#   - checked に入っている組み合わせだけ「対戦なし」と出す（調べていない組み合わせは何も出さない）。
#   - 2回戦の「1回戦の勝者どうし」のカードは、1回戦の結果が出てから追加で調べる。
# =====================================================================

