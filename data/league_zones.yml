# ============================================================
# 順位表の「昇格圏・降格圏」色分け定義
# ============================================================
# ここに書いたリーグだけ、順位表の行に色帯＋淡い背景＋凡例が付く。
# 書いていないリーグ／確認できていない枠は「何も色を付けない」＝安全設計。
#
# ■ zone の書き方
#   ranks: [1]            … 順位を直接指定
#   slots: 2 / from: top  … 上から2枠（bottom なら下から）
#   skipSecondTeams: true … プレミア所属チームのセカンドチーム(2nd/3rd)を飛ばして
#                           次順位に枠が繰り下がる（JFA参入戦要項＋2023-2024東北の実績で確認済み）
#
# ■ type（色）— 意味の近いものは明るさではなく色相を変える
#   final              金   プレミアファイナル進出
#   promotion          緑   上位ディビジョンへ自動昇格
#   playoff            青緑 プレミアリーグ参入戦（プレーオフ）出場圏
#   relegation_playoff 橙   降格プレーオフ・入替戦
#   relegation         赤   自動降格
#
# ■ ⚠ 降格枠についての重要な注意（2026-08-30 調査で確定）
#   降格チーム数は固定ではない。プレミアリーグとの入替結果でリーグの
#   チーム数が動くため、実際の降格数は毎年12月の参入戦終了後に確定する。
#   （実績：プリンス関東1部の降格は 2023年=2 / 2024年=1 / 2025年=4）
#   そのため下位の色分けは confidence: standard（＝原則）とし、
#   凡例に必ず注記を出す。断定できない地域は zone を書かない。
# ============================================================

_meta:
  updated: "2026-08-30"
  season: 2026
  relegation_note: "が付いた枠は通常年の目安です。昇格・降格するチーム数はプレミアリーグとの入替結果によって変動し、12月の参入戦終了後に確定します。"
  playoff_note: "プレミアリーグ所属チームのセカンドチームは参入戦に出場できないため、その分は次順位に繰り下がります。"

