# ============================================================
# 参入戦ページ「各地域のプリンスリーグ参入戦 暫定出場チーム」の手で持つ情報（2026-10-12 新設）
#   生成: scraper/generate_prince_playoff_outlook.py（毎日の自動更新・push 起動の run でも作り直す）
#   書き換える場所: tournaments/promotion-playoff-2026/index.html の
#                   <!-- PRINCE-PLAYOFF-OUTLOOK:START --> 〜 <!-- PRINCE-PLAYOFF-OUTLOOK:END --> の間だけ
#
# ■ 各県の枠
#   東北〜九州の県は league_zones.yml の pref-*-1 の slots をそのまま読む（同じ事実を2か所に持たない）。
#   league_zones.yml に無い北海道（自動昇格）と四国だけ、ここに書く。
#   ⚠️ 四国を league_zones.yml に足して県ページを色付けするのは、まだやらない（2026-10-12 Kei 決定＝この表に載せるまで）。
#
# ■ 下のチーム（2nd・B・Ⅱ・S など）の対応表 second_teams
#   県1部の表記 → 同じ学校・クラブの上のチーム（プレミア／プリンスの official_standings の表記と完全一致）。
#   あいまい一致はしない。対応表に無い下のチームが枠の中・枠のすぐ下に来たら [要確認] で止まり、表は書き換えない。
#   上のチームが2つある学校（青森山田3rd など）はリストで書く。
#   「A」が付くチーム（明秀日立A・湘南ベルマーレA など）はいちばん上のチームなので、ここには書かない。
#
# ■ 公式発表で確定した県 confirmed
#   書いた県は順位からの計算をやめ、書いたチームを「確定」バッジ付きで出す。
#   例:  confirmed:
#          niigata: {teams: ["上越2nd", "新潟明訓2nd"], note: "新潟県サッカー協会 発表（11/◯）"}
# ============================================================
season: 2026

# 地域の並び・行き先のリーグ・県の並び（県名は表示用）
regions:
  - key: hokkaido
    name: 北海道
    dest: prince-hokkaido
    dest_label: プリンス北海道
    auto_promotion: true          # 参入戦ではなく自動昇格
    prefs: {hokkaido: 北海道}
  - key: tohoku
    name: 東北
    dest: prince-tohoku
    dest_label: プリンス東北
    prefs: {aomori: 青森, iwate: 岩手, miyagi: 宮城, akita: 秋田, yamagata: 山形, fukushima: 福島}
  - key: kanto
    name: 関東
    dest: prince-kanto-2
    dest_label: プリンス関東2部
    prefs: {ibaraki: 茨城, tochigi: 栃木, gunma: 群馬, saitama: 埼玉, chiba: 千葉, tokyo: 東京, kanagawa: 神奈川, yamanashi: 山梨}
  - key: hokushinetsu
    name: 北信越
    dest: prince-hokushinetsu-2
    dest_label: プリンス北信越2部
    prefs: {niigata: 新潟, nagano: 長野, toyama: 富山, ishikawa: 石川, fukui: 福井}
  - key: tokai
    name: 東海
    dest: prince-tokai
    dest_label: プリンス東海
    prefs: {shizuoka: 静岡, aichi: 愛知, gifu: 岐阜, mie: 三重}
  - key: kansai
    name: 関西
    dest: prince-kansai-2
    dest_label: プリンス関西2部
    prefs: {shiga: 滋賀, kyoto: 京都, osaka: 大阪, hyogo: 兵庫, nara: 奈良, wakayama: 和歌山}
  - key: chugoku
    name: 中国
    dest: prince-chugoku
    dest_label: プリンス中国
    prefs: {hiroshima: 広島, shimane: 島根, okayama: 岡山, tottori: 鳥取, yamaguchi: 山口}
  - key: shikoku
    name: 四国
    dest: prince-shikoku
    dest_label: プリンス四国
    note: "※昨年と同じ方式であれば（四国は要項に各県の枠が書かれていないため、各県1チームとしています）"
    prefs: {tokushima: 徳島, kagawa: 香川, ehime: 愛媛, kochi: 高知}
  - key: kyushu
    name: 九州
    dest: prince-kyushu-2
    dest_label: プリンス九州2部
    prefs: {fukuoka: 福岡, saga: 佐賀, nagasaki: 長崎, kumamoto: 熊本, oita: 大分, miyazaki: 宮崎, kagoshima: 鹿児島, okinawa: 沖縄}

# 来季のリーグを見積もるときの、地域ごとのリーグの段（上から）。最後の pref は「県リーグ」。
ladders:
  hokkaido:     [premier, prince-hokkaido, pref]
  tohoku:       [premier, prince-tohoku, pref]
  kanto:        [premier, prince-kanto-1, prince-kanto-2, pref]
  hokushinetsu: [premier, prince-hokushinetsu-1, prince-hokushinetsu-2, pref]
  tokai:        [premier, prince-tokai, pref]
  kansai:       [premier, prince-kansai-1, prince-kansai-2, pref]
  chugoku:      [premier, prince-chugoku, pref]
  shikoku:      [premier, prince-shikoku, pref]
  kyushu:       [premier, prince-kyushu-1, prince-kyushu-2, pref]

# league_zones.yml に無い県の枠
extra_slots:
  hokkaido: 2      # 北海道FAリーグ上位2が自動昇格
  tokushima: 1
  kagawa: 1
  ehime: 1
  kochi: 1

# ⚠️ キー名を no にしない（YAML は裸の no を false と読む）。試合番号は game。
